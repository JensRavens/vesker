# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  date:
    formats:
      album_day: "%a, %b %-d"
  time:
    formats:
      capture: "%a, %b %-d · %-I:%M %p"
      comment: "%b %-d, %-I:%M %p"
  components:
    hero:
      summary: "%{people} people · %{moments} moments"
      summary_filtered: "%{selected} of %{total} people"
      filter: "Filter by person"
    people_picker:
      header: "Show photos from"
      everyone: "Everyone"
    day_section:
      item_count:
        one: "1 item"
        other: "%{count} items"
    footer:
      message: "That's the trip so far ✦"
    moment_detail:
      close: "Back to album"
      download: "Download original"
      like: "Like"
      unlike: "Remove like"
    not_found:
      brand: "Vesker"
      title: "This album link isn’t valid"
      message: "Double-check the link you were sent — it may have a typo, or this album may no longer exist."
      caption: "collecting small good moments ✦"
  views:
    sessions:
      new:
        title: "Add your name to the album"
        subhead: "Pop in your email so we can label what you like. No password — viewing is always free."
        placeholder: "you@email.com"
        submit: "Continue"
        dismiss: "Not now"
      verify:
        title: "Check your email"
        subhead: "Enter the 6-digit code we just sent to %{email}."
        submit: "Confirm"
        change_email: "Use a different email"
  sessions:
    verify:
      invalid_code: "That code isn’t right or has expired. Try again."
