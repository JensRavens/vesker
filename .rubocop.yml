# Shimmer's StandardRB-based house style.
inherit_gem:
  shimmer: config/rubocop_base.yml

AllCops:
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

# Overwrite or add project-specific rules below.

# Forbid `# frozen_string_literal: true` magic comments.
Style/FrozenStringLiteralComment:
  EnforcedStyle: never
